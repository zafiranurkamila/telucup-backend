<!DOCTYPE html>
<html>
<head>
    <style>
        .col { width: 280px; position: relative; margin-bottom: 20px; }
        .bracket-round {
            display: flex;
            flex-direction: column;
            width: 280px;
        }
        .match-wrapper {
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            height: 100px; /* fixed for test */
            border: 1px solid #eee;
        }
        .match-wrapper::after {
            content: '';
            position: absolute;
            border-color: red;
            z-index: 10;
        }
        .match-wrapper::after {
            right: -21px;
            width: 21px;
            border-right-width: 2px;
            border-right-style: solid;
        }
        .match-wrapper:nth-of-type(odd)::after {
            top: 50%;
            height: 50%;
            border-top-width: 2px;
            border-top-style: solid;
        }
        .match-wrapper:nth-of-type(even)::after {
            top: 0;
            height: 50%;
            border-bottom-width: 2px;
            border-bottom-style: solid;
        }
    </style>
</head>
<body>
    <div class="bracket-round">
        <template></template>
        <div class="match-wrapper">Match 1</div>
        <div class="match-wrapper">Match 2</div>
    </div>
</body>
</html>
