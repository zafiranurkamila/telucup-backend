<!DOCTYPE html>
<html>
<head>
    <style>
        .bracket-round-col {
            display: flex;
            flex-direction: column;
            width: 280px;
            position: relative;
        }

        .bracket-round {
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex: 1 1 auto;
            position: relative;
        }
        .bracket-round > * {
            flex: 1 1 0%;
        }

        .match-wrapper {
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            padding: 12px 0;
            width: 100%;
        }

        .match-wrapper::after, .match-wrapper::before {
            content: '';
            position: absolute;
            border-color: #cbd5e1;
            z-index: 0;
        }

        .match-wrapper:not(.is-last-round)::after {
            right: -21px;
            width: 21px;
            border-right-width: 2px;
            border-right-style: solid;
        }

        .match-wrapper:not(.is-last-round).is-top-match::after {
            top: 50%;
            height: 50%;
            border-top-width: 2px;
            border-top-style: solid;
            border-right-width: 2px;
            border-right-style: solid;
        }

        .match-wrapper:not(.is-last-round).is-bottom-match::after {
            top: 0;
            height: 50%;
            border-bottom-width: 2px;
            border-bottom-style: solid;
            border-right-width: 2px;
            border-right-style: solid;
        }

        .match-card {
            background-color: white;
            border: 1px solid #ccc;
            height: 60px;
            width: 100%;
            position: relative;
            z-index: 10;
        }
    </style>
</head>
<body style="padding: 100px;">
    <div class="bracket-round-col" style="height: 400px; border: 1px solid red;">
        <div class="bracket-round">
            <template></template>
            <div class="match-wrapper is-top-match"><div class="match-card">Match 1</div></div>
            <div class="match-wrapper is-bottom-match"><div class="match-card">Match 2</div></div>
            <div class="match-wrapper is-top-match"><div class="match-card">Match 3</div></div>
            <div class="match-wrapper is-bottom-match"><div class="match-card">Match 4</div></div>
        </div>
    </div>
</body>
</html>
