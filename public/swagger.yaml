openapi: 3.0.0
info:
  title: TelU Cup Backend API
  description: API documentation for TelU Cup event management system, including player registration, self-assessment scoring, match verification, and chatbot interactions.
  version: 1.0.0
  contact:
    email: admin@telucup.com
servers:
  - url: http://localhost:8000
    description: Local Development Server
tags:
  - name: Authentication
    description: Login and Registration for API testing
  - name: Campaign
    description: Endpoints for safety and culture campaigns
  - name: Players
    description: Player registration and management
  - name: Self Assessment
    description: Injury risk assessments and medical reviews
  - name: Field Verification
    description: Match check-in and player verifications
  - name: Panitia & Brackets
    description: Match generation, verification, and score updates
  - name: General
    description: Public utilities and AI chatbot

paths:
  /campaign:
    get:
      tags:
        - Campaign
      summary: Get campaign content
      description: Retrieve the safety and culture campaign content to display to users.
      operationId: getCampaign
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  title:
                    type: string
                  subtitle:
                    type: string
                  values:
                    type: object
                  checkpoints:
                    type: array
                    items:
                      type: object
                  show_again_option:
                    type: boolean

  /campaign/confirm:
    post:
      tags:
        - Campaign
      summary: Confirm campaign read
      description: Confirm that the user has read the campaign and optionally choose not to show it again.
      operationId: confirmCampaign
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                dont_show_again:
                  type: boolean
                  example: true
      responses:
        '200':
          description: Confirmation accepted

  /players:
    get:
      tags:
        - Players
      summary: Daftar semua player
      description: Mengembalikan semua player beserta data user, cabang olahraga, kategori, dan kontingen. Hanya dapat diakses oleh admin dan panitia.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Daftar player berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlayerDetail'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden — role tidak diizinkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Players
      summary: Register a new player and User account
      description: Adds a new player to a contingent and creates a login account. Requires `pic_kontingen`, `admin`, or `panitia` role.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayerInput'
      responses:
        '200':
          description: Player created successfully
        '422':
          description: Validation errors
        '401':
          description: Unauthorized

  /pic-kontingen:
    get:
      tags:
        - Players
      summary: Daftar semua PIC kontingen
      description: Mengembalikan semua user dengan role `pic_kontingen` beserta data kontingen yang mereka kelola. Hanya dapat diakses oleh admin dan panitia.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Daftar PIC kontingen berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PicKontingenDetail'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden — role tidak diizinkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /summary/contingent:
    get:
      tags:
        - Players
      summary: Get contingent risk summary
      description: Returns the count of players with high, moderate, and low risk per contingent.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContingentSummary'

  /self-assessment:
    post:
      tags:
        - Self Assessment
      summary: Submit self assessment
      description: Submit player injury assessment to be evaluated by the AI scoring system.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelfAssessmentInput'
      responses:
        '200':
          description: Assessment saved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  risk:
                    type: string
                  confidence:
                    type: number
                  recommendation:
                    type: string
                  message:
                    type: string

  /self-assessment/review/{id}:
    post:
      tags:
        - Self Assessment
      summary: Submit medical review
      description: Update the assessment with a professional medical review (allowed to play or not). Requires `panitia` role.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - is_allowed_to_play
              properties:
                medical_notes:
                  type: string
                  example: "Requires 2 days rest"
                is_allowed_to_play:
                  type: boolean
                  example: false
      responses:
        '200':
          description: Review saved successfully

  /field/verification:
    get:
      tags:
        - Field Verification
      summary: Get verified players
      description: Retrieve the list of players ready for field verification. Requires `panitia` role.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of players

  /field/checkin/{id}:
    post:
      tags:
        - Field Verification
      summary: Player check-in
      description: Check a player into the match. Requires `panitia` role.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Check-in successful

  /bracket/generate:
    post:
      tags:
        - Panitia & Brackets
      summary: Generate match brackets
      description: Auto-generates match brackets for the tournament. Requires `panitia` role.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Brackets generated

  /bracket/update-score/{id}:
    post:
      tags:
        - Panitia & Brackets
      summary: Update match score
      description: Update the score of a specific match. Requires `panitia` role.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                score_team_1:
                  type: integer
                score_team_2:
                  type: integer
      responses:
        '200':
          description: Score updated successfully

  /bracket/detail/{id}:
    get:
      tags:
        - Panitia & Brackets
      summary: Get match details
      description: Get public details and score of a specific match.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Match details

  /gallery:
    get:
      tags:
        - General
      summary: Get gallery images
      description: Retrieve list of gallery images/photos from the event.
      responses:
        '200':
          description: Successful response

  /event-photos:
    post:
      tags:
        - General
      summary: Upload event photo
      description: Upload and store an event photo.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                photo:
                  type: string
                  format: binary
      responses:
        '200':
          description: Photo uploaded successfully

  /chatbot/ask:
    post:
      tags:
        - General
      summary: Ask AI Chatbot
      description: Send a prompt to the AI chatbot for automated assistance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  example: "Bagaimana cara melakukan registrasi?"
      responses:
        '200':
          description: Chatbot response
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string

  /register:
    post:
      tags:
        - Authentication
      summary: Register a new Panitia
      description: Create a new Panitia user and get an API token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                  example: "Panitia Baru"
                email:
                  type: string
                  example: "panitia@telucup.com"
                password:
                  type: string
                  example: "password123"
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                  token:
                    type: string

  /admin/users/{id}/promote-to-pic:
    put:
      tags:
        - Panitia & Brackets
      summary: Promote player to PIC Kontingen
      description: Update a player's role to PIC Kontingen so they can manage their contingent. Requires `panitia` role.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User promoted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    type: object

  /admin/templates:
    get:
      tags:
        - Panitia & Brackets
      summary: Get document templates
      description: Retrieve document templates for registration. Requires `panitia` role.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of templates

  /admin/registrations:
    get:
      tags:
        - Panitia & Brackets
      summary: Get list of registrations
      description: Retrieve all team registrations for verification. Requires `panitia` role.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Paginated list of registrations

  /admin/registrations/{id}/verify:
    post:
      tags:
        - Panitia & Brackets
      summary: Verify team registration
      description: Approve or reject a team's registration. Requires `panitia` role.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [verified, rejected]
      responses:
        '200':
          description: Registration status updated

  /admin/schedules:
    get:
      tags:
        - Panitia & Brackets
      summary: Get match schedules
      description: Retrieve all match schedules. Requires `panitia` role.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of schedules

  /login:
    post:
      tags:
        - Authentication
      summary: Login to get API token
      description: Authenticate with email and password to receive a Bearer token for protected endpoints.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  example: "panitia@telucup.com"
                password:
                  type: string
                  example: "password123"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                  token:
                    type: string
        '422':
          description: Invalid credentials

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    PlayerInput:
      type: object
      properties:
        name:
          type: string
          example: "John Doe"
        nim_nip:
          type: string
          example: "1301234567"
        sport_branch:
          type: string
          example: "Basket"
        contingent:
          type: string
          example: "Fakultas Informatika"
    ContingentSummary:
      type: object
      properties:
        contingent:
          type: string
          example: "Fakultas Informatika"
        high_risk_count:
          type: integer
          example: 2
        moderate_risk_count:
          type: integer
          example: 5
        low_risk_count:
          type: integer
          example: 15
        total_players:
          type: integer
          example: 22
    SelfAssessmentInput:
      type: object
      properties:
        player_id:
          type: integer
          example: 1
        injury_history:
          type: string
          example: "Cedera lutut ringan"
        injury_location:
          type: string
          example: "Lutut kanan"
        current_condition:
          type: string
          example: "Nyeri saat ditekuk"
        pain_score:
          type: integer
          example: 4
        form_responses:
          type: array
          items:
            type: string
          example: ["Pernah pingsan saat olahraga: Tidak"]

    PlayerDetail:
      type: object
      properties:
        id:
          type: integer
          example: 7
        user_id:
          type: integer
          example: 12
        name:
          type: string
          example: "Ahmad Fauzi"
        nim_nip:
          type: string
          nullable: true
          example: "1301234567"
        sport_id:
          type: integer
          nullable: true
          example: 2
        sport_category_id:
          type: integer
          nullable: true
          example: 1
        contingent_id:
          type: integer
          nullable: true
          example: 3
        photo_path:
          type: string
          nullable: true
          example: "https://res.cloudinary.com/demo/image/upload/v1/telucup/player_profiles/player_7.jpg"
        employee_status:
          type: string
          nullable: true
          example: "mahasiswa"
        work_location:
          type: string
          nullable: true
          example: "Bandung"
        checked_in_at:
          type: string
          format: date-time
          nullable: true
          example: null
        created_at:
          type: string
          format: date-time
          example: "2025-01-15T08:30:00.000000Z"
        updated_at:
          type: string
          format: date-time
          example: "2025-01-20T14:00:00.000000Z"
        user:
          type: object
          nullable: true
          properties:
            id:
              type: integer
              example: 12
            name:
              type: string
              example: "Ahmad Fauzi"
            email:
              type: string
              example: "ahmad@telkomuniversity.ac.id"
            role:
              type: string
              example: "player"
            is_kacamata:
              type: boolean
              example: false
        sport:
          type: object
          nullable: true
          properties:
            id:
              type: integer
              example: 2
            name:
              type: string
              example: "Futsal"
        sport_category:
          type: object
          nullable: true
          properties:
            id:
              type: integer
              example: 1
            name:
              type: string
              example: "Putra"
        contingent:
          type: object
          nullable: true
          properties:
            id:
              type: integer
              example: 3
            name:
              type: string
              example: "Fakultas Informatika"

    PicKontingenDetail:
      type: object
      properties:
        id:
          type: integer
          example: 5
        name:
          type: string
          example: "Budi Santoso"
        email:
          type: string
          example: "budi@telkomuniversity.ac.id"
        role:
          type: string
          example: "pic_kontingen"
        managed_contingent:
          type: object
          nullable: true
          properties:
            id:
              type: integer
              example: 3
            name:
              type: string
              example: "Fakultas Informatika"
            pic_user_id:
              type: integer
              example: 5

    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: "Forbidden."
